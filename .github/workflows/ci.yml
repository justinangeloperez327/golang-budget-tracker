name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Toolchain
        run: go version
      - name: Resolve pinned dependencies
        run: go mod tidy
      - name: Inspect resolved modules (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "::group::Resolved go.mod"
          cat go.mod
          echo "::endgroup::"
          echo "::group::Resolved go.sum"
          cat go.sum
          echo "::endgroup::"
      - name: Verify downloaded dependencies
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Build
        run: go build ./cmd/server
      - name: Formatting (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          gofmt -w cmd internal tests
          git diff --exit-code -- '*.go'
      - name: Race tests (Linux)
        if: runner.os == 'Linux'
        run: go test -race ./...

  sqlc:
    name: Verify SQL generation (sqlc 1.31.1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned sqlc binary with SHA256 validation
        shell: bash
        run: |
          curl -fsSL --retry 3 -o /tmp/sqlc.tar.gz https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz
          echo '497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354  /tmp/sqlc.tar.gz' | sha256sum -c -
          tar -xzf /tmp/sqlc.tar.gz -C /tmp
          /tmp/sqlc version
      - name: Regenerate SQL code and inspect diff
        shell: bash
        run: |
          /tmp/sqlc generate
          git diff -- internal/platform/database/sqlc
          echo "::group::Generated sqlc files"
          find internal/platform/database/sqlc -type f | sort
          for f in internal/platform/database/sqlc/*.go; do echo "-- $f"; cat "$f"; done
          echo "::endgroup::"
          test -z "$(git status --porcelain -- internal/platform/database/sqlc)"

  database-integration:
    name: PostgreSQL 17 and Goose migrations
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: budget_test
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: budget_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget_test -d budget_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://budget_test:ci_test_only@127.0.0.1:5432/budget_tracker_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve Go dependencies
        run: go mod tidy
      - name: Install pinned Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.29.0
      - name: Apply migrations
        shell: bash
        run: |
          "$(go env GOPATH)/bin/goose" -dir db/migrations postgres "$TEST_DATABASE_URL" up
          "$(go env GOPATH)/bin/goose" -dir db/migrations postgres "$TEST_DATABASE_URL" status
      - name: Test PostgreSQL integration and transactions
        run: go test -tags=integration -count=1 ./tests/integration
      - name: Validate migration down/up cycle against disposable CI database
        shell: bash
        run: |
          "$(go env GOPATH)/bin/goose" -dir db/migrations postgres "$TEST_DATABASE_URL" down
          "$(go env GOPATH)/bin/goose" -dir db/migrations postgres "$TEST_DATABASE_URL" up
          go test -tags=integration -count=1 ./tests/integration

  node:
    name: Node 24 tooling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check:node
      - run: npm test
      - run: npm run assets:build
      - run: test -s web/assets/app.css

  container:
    name: Docker and Compose validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build Docker image
        run: docker build --tag golang-budget-tracker:ci .
